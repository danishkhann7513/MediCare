{% extends "layout.html" %}

{% block content %}

<div class="auth-card" style="max-width: 500px;">
  
  <div style="text-align: center; margin-bottom: 2rem;">
    <h2 style="font-family: var(--font-head); color: var(--dark); font-weight: 700;">Reset Password</h2>
    <p style="color: var(--text); font-size: 0.95rem;">
      Enter your registered email address and we'll send you a link to reset your password.
    </p>
  </div>

  <form method="POST">
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" name="email" id="email" placeholder="name@example.com" required>
    </div>
    
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
      Send Reset Link
    </button>

  </form>

  <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #f1f5f9;">
    <a href="{{ url_for('login') }}" style="color: var(--text); font-size: 0.9rem; text-decoration: none; transition: 0.3s;">
      &larr; Back to Login
    </a>
  </div>

</div>

{% endblock %}
