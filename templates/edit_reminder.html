{% extends "layout.html" %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<div class="auth-card" style="max-width: 600px;">
  
  <div style="text-align: center; margin-bottom: 2rem;">
    <h2 style="font-family: var(--font-head); color: var(--dark); font-weight: 700;">Edit Reminder</h2>
    <p style="color: var(--text); font-size: 0.95rem;">Update details for <strong>{{ r['medicine_name'] }}</strong></p>
  </div>

  <form method="post">
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="form-group">
        <label>Medicine Name</label>
        <input type="text" name="medicine_name" value="{{ r['medicine_name'] }}" required>
      </div>

      <div class="form-group">
        <label>Dosage</label>
        <input type="text" name="dosage" value="{{ r['dosage'] or '' }}">
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="form-group">
        <label>Reminder Time</label>
        <input type="text" id="time-picker" name="reminder_time" value="{{ r['reminder_time'] or '' }}" required style="background-color: white;">
      </div>

      <div class="form-group">
        <label>Frequency</label>
        <select name="frequency" id="frequency" onchange="toggleDateField()">
          <option value="Daily" {% if r['frequency'] == 'Daily' %}selected{% endif %}>Daily</option>
          <option value="Once" {% if r['frequency'] == 'Once' %}selected{% endif %}>Once</option>
          <option value="Weekly" {% if r['frequency'] == 'Weekly' %}selected{% endif %}>Weekly</option>
        </select>
      </div>
    </div>

    <div class="form-group" id="date-group" style="display: none; margin-top: 10px;">
      <label>Reminder Date</label>
      <input type="date" name="reminder_date" value="{{ r['reminder_date'] or '' }}">
      <small style="color: var(--text); font-size: 0.85rem;">Required for one-time reminders.</small>
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
      <input type="checkbox" name="send_email" id="send_email" {% if r['send_email'] %}checked{% endif %} style="width: auto; margin: 0; cursor: pointer;">
      <label for="send_email" style="margin: 0; cursor: pointer; font-weight: 500;">Send email reminder</label>
    </div>

    <div style="margin-top: 2rem; display: flex; gap: 15px;">
      <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
    </div>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    // 1. Initialize Flatpickr with the existing time
    flatpickr("#time-picker", {
        enableTime: true,
        noCalendar: true,
        dateFormat: "H:i",
        altInput: true,
        altFormat: "h:i K",
        time_24hr: false,
        defaultDate: "{{ r['reminder_time'] }}" // Pre-fills the picker
    });

    // 2. Logic to Show/Hide Date field
    function toggleDateField() {
        const frequency = document.getElementById('frequency').value;
        const dateGroup = document.getElementById('date-group');
        
        // Check case-insensitive to be safe
        if (frequency.toLowerCase() === 'once') {
            dateGroup.style.display = 'block';
        } else {
            dateGroup.style.display = 'none';
        }
    }

    // 3. Run immediately on load to handle pre-existing "Once" reminders
    document.addEventListener('DOMContentLoaded', function() {
        toggleDateField();
    });
</script>
{% endblock %}
