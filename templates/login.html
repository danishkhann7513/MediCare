{% extends "layout.html" %}

{% block content %}

<div class="auth-card">
  
  <div style="text-align: center; margin-bottom: 2rem;">
    <h2 style="font-family: var(--font-head); color: var(--dark); font-weight: 700;">Welcome Back</h2>
    <p style="color: var(--text); font-size: 0.95rem;">Please login to your account</p>
  </div>

  <form method="post">
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" name="email" id="email" placeholder="name@example.com" required>
    </div>

    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label for="password" style="margin-bottom: 0;">Password</label>
        <a href="{{ url_for('forgot_password') }}" style="font-size: 0.85rem; color: var(--primary);">Forgot?</a>
      </div>
      <input type="password" name="password" id="password" placeholder="Enter your password" required style="margin-top: 5px;">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
      Secure Login
    </button>

  </form>
  
  <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #f1f5f9;">
    <p style="font-size: 0.9rem; color: var(--text);">
      Don't have an account? 
      <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Register here</a>
    </p>
  </div>

</div>

{% endblock %}
